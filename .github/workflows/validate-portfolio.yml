name: Validate portfolio
on:
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'worker/**'
      - 'scripts/**'
      - 'sitemap.xml'
      - '.github/workflows/validate-portfolio.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/js/portfolio-v2.js
      - run: node --check worker/index.js
      - run: node scripts/validate-site.mjs
